name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: swift build
      - name: Unit tests
        id: tests
        shell: bash
        run: swift test 2>&1 | tee .build/swift-test.log
      - name: CLI password prompt test
        run: python3 Tests/cli_password_prompt_test.py
      - name: Mergify Test Engine Upload
        if: (success() || failure()) && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && hashFiles('.build/swift-test.log') != ''
        env:
          MERGIFY_TEST_EXIT_CODE: ${{ steps.tests.outcome == 'success' && '0' || '1' }}
        run: |
          command -v xcbeautify >/dev/null || brew install xcbeautify
          xcbeautify --quiet --report junit --report-path .build --junit-report-filename junit.xml < .build/swift-test.log > /dev/null
          python3 -m venv "$RUNNER_TEMP/mergify-cli"
          "$RUNNER_TEMP/mergify-cli/bin/pip" install --disable-pip-version-check --quiet mergify-cli==2026.11.16
          "$RUNNER_TEMP/mergify-cli/bin/mergify" ci junit-process .build/junit.xml
