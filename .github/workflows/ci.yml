name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify immutable workflow action pins
        run: node tools/verify-action-pins.mjs
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test
      - name: CLI password prompt test
        run: python3 Tests/cli_password_prompt_test.py
