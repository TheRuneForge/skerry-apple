name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: swift build
      - name: Unit tests
        id: tests
        run: swift test --xunit-output .build/junit.xml
      - name: Mergify Test Engine Upload
        if: (success() || failure()) && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && hashFiles('.build/junit.xml') != ''
        uses: mergifyio/gha-mergify-ci@v30
        with:
          report_path: .build/junit.xml
          test_step_outcome: ${{ steps.tests.outcome }}
      - name: CLI password prompt test
        run: python3 Tests/cli_password_prompt_test.py
