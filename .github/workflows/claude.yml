
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude:
    runs-on: ubuntu-latest

    steps:
      - name: Claude Code Action Official
        uses: anthropics/claude-code-action@v1.0.289
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
