# Mergify automatically queues ready PRs once the repository's ruleset
# is migrated off GitHub's native merge_queue rule.

merge_protections_settings:
  auto_merge_conditions: true
  post_comment: true
  reporting_method: check-runs

queue_rules:
  - name: default
    merge_method: squash
    queue_conditions:
      - base = main
    merge_conditions:
      - check-success = test

pull_request_rules:
  - name: automatically queue ready pull requests
    conditions:
      - base = main
      - -draft
    actions:
      queue:
